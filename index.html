<!DOCTYPE html>
<html>
    <head>
        <title>Atividade 11</title>
    </head>
    <body>
        <h1>Exemplo de Uso das Tags &lt;figure&lt; e &lt;figcapion&lt;</h1>

        <figure>
            <img src="https://placehold.co/300x200" alt="Exemplo de imagem com legenda">

            <figcaption>Figura 1: Exemplo de uma imagem com legenda explicativa utilizando &lt;figure&lt; e &lt;figcapion&lt;.</figcaption>
        </figure>

        <figure>
            <figcaption>Figura 2: Diagrama mostrando a estrutura de um documento HTML.</figcaption>

            <img src="https://placehold.co/300x200/blue/grey" alt="Diagrama de estrutura HTML">
        </figure>
    </body>
</html>
